pipeline:
  name: coppellfornewtech

on:
  push:
    branches: [main]
  manual: true

runner:
  labels: []
  fallback: any

jobs:
  build:
    mode: shell
    commands:
      - |
        set -e
        rm -f /tmp/digest-coppellfornewtech
        docker system prune -f || true
        SHA=$(git rev-parse --short HEAD)
        docker build -t ${REGISTRY_HOST}/coppellfornewtech-website:${SHA} .
        PUSH=$(docker push ${REGISTRY_HOST}/coppellfornewtech-website:${SHA} 2>&1); echo "$PUSH"
        DIGEST=$(echo "$PUSH" | grep "${SHA}: digest:" | grep -o 'sha256:[a-f0-9]\{64\}')
        case "$DIGEST" in sha256:*) ;; *) echo "no digest for coppellfornewtech-website:${SHA}"; exit 1;; esac
        echo "${DIGEST}" > /tmp/digest-coppellfornewtech
        docker system prune -f || true

  update-gitops:
    mode: shell
    depends_on: [build]
    on:
      push:
        branches: [main]
    commands:
      - |
        set -e
        DIGEST=$(cat /tmp/digest-coppellfornewtech)
        rm -rf /tmp/mesh-gitops
        git -c http.sslVerify=false clone ${GITOPS_REPO_URL} /tmp/mesh-gitops
        sed -i "s|registry.local:5000/coppellfornewtech-website[@:].*|registry.local:5000/coppellfornewtech-website@${DIGEST}|" /tmp/mesh-gitops/apps/coppellfornewtech/deployment.yaml
        git -C /tmp/mesh-gitops config user.email "ci@mesh"
        git -C /tmp/mesh-gitops config user.name "mesh-ci"
        git -C /tmp/mesh-gitops add apps/coppellfornewtech/deployment.yaml
        git -C /tmp/mesh-gitops diff --cached --quiet || git -C /tmp/mesh-gitops commit -m "ci: update coppellfornewtech to $(printf '%.12s' "${DIGEST}")"
        git -C /tmp/mesh-gitops -c http.sslVerify=false pull --rebase origin main
        git -C /tmp/mesh-gitops -c http.sslVerify=false push origin main
